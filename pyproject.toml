# AGENCY OS — pyproject.toml
# Proper Python package configuration

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "astra-os"
version = "1.0.0a1"
description = "ASTRA OS — AI-Native Creative Intelligence + Agency ERP (deploy-ready)"
readme = "README.md"
license = { text = "AGENCY OS Commercial License" }
requires-python = ">=3.10"
authors = [
    { name = "AGENCY OS Team", email = "team@agencyos.com" }
]
keywords = ["ai", "creative", "agency", "erp", "intelligence", "mcp", "agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Office/Business",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

# Core dependencies — lean boot path (heavy ML kept optional under [local])
dependencies = [
    "openai>=2.53.0",
    "anthropic>=0.120.2",
    "google-genai>=2.17.0",
    "mcp>=1.29.0",
    "chromadb>=1.5.9",
    "networkx>=3.6",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.2",
    "httpx>=0.28.1",
    "websockets>=15.0.1",
    "watchdog>=6.0.0",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.1",
    "click>=8.4.2",
    "jinja2>=3.1.6",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "tenacity>=9.1.4",
]

[project.optional-dependencies]
# API server
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "python-multipart>=0.0.32",
    "authlib>=1.7.2",
    "pyjwt>=2.13.0",
    "bcrypt>=5.0.0",
]

# Database
db = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.30",
    "psycopg2-binary>=2.9",
    "redis>=5.0",
]

# Testing
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "httpx>=0.28.1",
    "faker>=25.0",
]

# Web UI (Python side only — frontend lives in aurora/ui, built with npm separately)
ui = [
    "jinja2>=3.1.6",
]

# DevOps
devops = [
    "docker>=7.0",
    "kubernetes>=30.0",
    "prometheus-client>=0.20",
    "grafanalib>=0.7",
]

# Local models (heavy — torch/CUDA, sentence-transformers, transformers)
local = [
    "ollama>=0.3.0",
    "sentence-transformers>=5.7.0",
    "transformers>=5.14.1",
    "torch>=2.13.0",
    "accelerate>=0.30",
    "bitsandbytes>=0.43",
    "google-adk>=2.6.2",
]

# Development
dev = [
    "black>=24.0",
    "ruff>=0.5.0",
    "mypy>=1.10",
    "pre-commit>=3.7",
    "ipykernel>=6.29",
]

# All extras combined
all = [
    "astra-os[api,db,test,dev]"
]

[project.scripts]
astra-os = "aurora.cli:main"
astra = "aurora.cli:main"
agency-os = "aurora.cli:main"
aos = "aurora.cli:main"
aurora = "aurora.cli:main"

[project.urls]
Homepage = "https://github.com/saintxlucid/AGENCY-OS"
Documentation = "https://github.com/saintxlucid/AGENCY-OS/tree/main/docs"
Repository = "https://github.com/saintxlucid/AGENCY-OS"
Issues = "https://github.com/saintxlucid/AGENCY-OS/issues"

[tool.setuptools.packages.find]
include = ["aurora*"]
exclude = ["tests*", "docs*"]

# ─── Tool Configurations ───

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-v --tb=short --cov=aurora --cov-report=term-missing"

[tool.coverage.run]
source = ["aurora"]
omit = ["tests/*", "aurora/api/*", "aurora/ui/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true