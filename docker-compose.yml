# ASTRA OS — Docker Compose (canonical core)
# Core stack only: api + worker + postgres + redis + chroma
# Observability: docker compose -f docker-compose.yml -f docker-compose.observability.yml up -d
# Env: cp .env.example .env  (compose reads .env automatically + env_file below)

services:
  # ─── ASTRA OS API Server ───
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-os-api
    ports:
      - "${API_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - AGENCY_OS_LOG_LEVEL=${AGENCY_OS_LOG_LEVEL:-INFO}
      - ASTRA_OS_LOG_LEVEL=${ASTRA_OS_LOG_LEVEL:-INFO}
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://agency_os:agency_os@postgres:5432/agency_os
      - CHROMA_URL=http://chroma:8000
    volumes:
      - agency_os_data:/app/agency_os_data
      - aurora_memory:/app/aurora_memory
      - uploads:/app/uploads
      - output:/app/output
    depends_on:
      - redis
      - postgres
      - chroma
    restart: unless-stopped
    networks:
      - agency-os-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ─── Redis (Cache + Queue) ───
  redis:
    image: redis:7-alpine
    container_name: astra-os-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - agency-os-network

  # ─── PostgreSQL (Primary Database) ───
  postgres:
    image: postgres:16-alpine
    container_name: astra-os-postgres
    environment:
      POSTGRES_DB: agency_os
      POSTGRES_USER: agency_os
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agency_os}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - agency-os-network

  # ─── ChromaDB (Vector Store) ───
  chroma:
    image: chromadb/chroma:latest
    container_name: astra-os-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    networks:
      - agency-os-network

  # ─── Worker (Background Tasks, optional — requires redis) ───
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: astra-os-worker
    command: python -m arq aurora.workers.settings.WorkerSettings
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://agency_os:agency_os@postgres:5432/agency_os
    volumes:
      - agency_os_data:/app/agency_os_data
      - aurora_memory:/app/aurora_memory
      - uploads:/app/uploads
    depends_on:
      - redis
      - postgres
    restart: unless-stopped
    networks:
      - agency-os-network

volumes:
  agency_os_data:
  aurora_memory:
  uploads:
  output:
  redis_data:
  postgres_data:
  chroma_data:

networks:
  agency-os-network:
    driver: bridge
